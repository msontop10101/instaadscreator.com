<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Builder — Tell us about your app</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4A2FE0}a:hover{color:#3420B0}
</style>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<div style="width: 390px; height: 1000px; position: relative; overflow: hidden; background: #F6F5F1; color: #111113; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px">
<a href="PromoType.html" aria-label="Back" style="width: 44px; height: 44px; background: #FFFFFF; border-radius: 12px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111113" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="font-size: 13px; font-weight: 600; color: #57575E">Step 1 of 1 · App</div>
<div style="width: 44px"></div>
</header>
<div style="margin: 0 20px; height: 4px; background: #4A2FE0; border-radius: 2px"></div>

<section style="padding: 22px 20px 0; display: flex; flex-direction: column; gap: 18px; flex-grow: 1">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em">Tell us about your app</h1>

<div style="display: flex; gap: 12px; align-items: flex-end">
<button type="button" aria-label="Upload app icon" style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 18px; border: 1.5px dashed #B9B6AC; background: #FFFFFF; font: 600 11px 'Inter', sans-serif; color: #3A3A40">Icon</button>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px"><label for="an" style="font-size: 14px; font-weight: 600">App name</label><input id="an" value="Stash" style="border: 1.5px solid #D9D7CF; border-radius: 14px; padding: 0 14px; min-height: 50px; font: 16px 'Inter', sans-serif; background: #FFFFFF; color: #111113"></div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="ad" style="font-size: 14px; font-weight: 600">What does it do?</label>
<textarea id="ad" rows="3" style="border: 1.5px solid #D9D7CF; border-radius: 14px; padding: 14px; font: 15px/1.5 'Inter', sans-serif; background: #FFFFFF; color: #111113; resize: none">Savings app. Lock money, earn interest, buy dollar assets. Start with ₦1,000.</textarea>
<div style="font-size: 12px; color: #5F5F66">AI writes the headline, features and FAQ from this.</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 14px; font-weight: 600">Screenshots <span style="font-weight: 400; color: #5F5F66">(up to 6)</span></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<div style="height: 120px; border-radius: 12px; background: #E2DEFF"></div>
<div style="height: 120px; border-radius: 12px; background: #E9ECFF"></div>
<div style="height: 120px; border-radius: 12px; background: #E2DEFF"></div>
<button type="button" aria-label="Add screenshot" style="height: 120px; border-radius: 12px; border: 1.5px dashed #B9B6AC; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#57575E" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="ios" style="font-size: 14px; font-weight: 600">App Store link</label>
<input id="ios" placeholder="https://apps.apple.com/…" style="border: 1.5px solid #D9D7CF; border-radius: 14px; padding: 0 14px; min-height: 50px; font: 15px 'Inter', sans-serif; background: #FFFFFF; color: #111113">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="gp" style="font-size: 14px; font-weight: 600">Google Play link</label>
<input id="gp" placeholder="https://play.google.com/store/apps/…" style="border: 1.5px solid #D9D7CF; border-radius: 14px; padding: 0 14px; min-height: 50px; font: 15px 'Inter', sans-serif; background: #FFFFFF; color: #111113">
<div style="font-size: 12px; color: #5F5F66">Add at least one. Buyers on iPhone see App Store first; Android sees Google Play first.</div>
</div>

<div role="radiogroup" aria-label="Pricing" style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 14px; font-weight: 600">Pricing</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" role="radio" aria-checked="true" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: none; background: #111113; color: #FFFFFF; font: 600 13px 'Inter', sans-serif">Free</button>
<button type="button" role="radio" aria-checked="false" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #D9D7CF; background: #FFFFFF; color: #3A3A40; font: 600 13px 'Inter', sans-serif">Free + in-app purchases</button>
<button type="button" role="radio" aria-checked="false" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #D9D7CF; background: #FFFFFF; color: #3A3A40; font: 600 13px 'Inter', sans-serif">Paid</button>
</div>
</div>
</section>

<div style="padding: 18px 20px 28px">
<a href="Generating.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; border-radius: 16px; background: #4A2FE0; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>Generate my app page</a>
</div>

</div>

</body>
</html>
